name: Check Script Diff(using /ee/maintained-apps/script-diff.sh)

on:
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0  # Fetch full history so merge base can be found
              
            - name: Get Changed Manifest Files # fetch the changed manifest files
              id: changed_files
              run: |
                echo "Fetching changed files..."
                git fetch origin main
                git diff --name-only origin/main...HEAD | grep -E 'ee/maintained-apps/(inputs|outputs)/.*\.json$' > changed_manifests.txt || true
                cat changed_manifests.txt
                if [ ! -s changed_manifests.txt ]; then
                    echo "No changed manifest files found."
                    exit 0
                fi
            - name: Run script-diff.sh and capture output
              run: |
                echo "Running script-diff.sh on files with script ref changes..."
                > script_diff_output.txt
                while read -r file; do
                  echo "=== Processing $file ===" >> script_diff_output.txt
                  ./ee/maintained-apps/script-diff.sh "$file" >> script_diff_output.txt 2>&1 || true
                  echo "" >> script_diff_output.txt
                done < script_ref_changed_files.txt

            - name: Comment script diff on PR
              uses: actions/github-script@v7
              with:
                script: |
                  const fs = require('fs');
                  const diffOutput = fs.readFileSync('script_diff_output.txt', 'utf8');
                  
                  const commentBody = `## Script Diff Results

                  The following install/uninstall script changes were detected:

                  \`\`\`
                  ${diffOutput}
                  \`\`\``;
                  
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });